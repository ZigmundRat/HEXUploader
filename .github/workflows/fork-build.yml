
name: Fork Build Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out current source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev xorg-dev

      - name: Build Windows application
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-w -s" -o HEXUploader.exe ./gui/

      - name: Build Linux/macOS application
        if: runner.os != 'Windows'
        run: go build -trimpath -ldflags="-w -s" -o HEXUploader ./gui/
